<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karoline Nielsen</title>
  <link rel="icon" href="/kn-logo-minimal.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-row">
      <div class="brand">Karoline Nielsen</div>
      <nav class="tabs" aria-label="Sections">
        <a class="tab" href="#journey" data-section="journey">Journey</a>
        <a class="tab" href="#travels" data-section="travels">Travels</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <section class="panel" id="journey" data-panel>
      <h1 id="journey-title">My Journey</h1>
      <p class="journey-subtitle">From curiosity to code — how studies, work, and life connect. Pick a domain to follow that thread, or scroll through the whole story.</p>

      <div id="domain-bar"></div>
      <div id="journey-timeline" class="journey-track"></div>
    </section>

    <section class="panel" id="travels" data-panel hidden>
      <h1>Travels</h1>
      <p>Places, projects, and stories (coming soon).</p>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">&copy; 2026 Karoline Nielsen</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
