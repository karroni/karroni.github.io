<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karoline Nielsen</title>
  <link rel="icon" href="/kn-logo-minimal.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-row">
      <div class="brand">Karoline Nielsen</div>
      <nav class="tabs" aria-label="Sections">
        <a class="tab" href="#studies" data-section="studies">Studies</a>
        <a class="tab" href="#work" data-section="work">Work</a>
        <a class="tab" href="#travels" data-section="travels">Travels</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="filter-bar"></div>

    <section class="panel" id="studies" data-panel>
      <h1>Studies</h1>
      <p>What I've learned — and what I can do with it.</p>
      <div id="studies-timeline" class="timeline" aria-label="Studies timeline"></div>
    </section>

    <section class="panel" id="work" data-panel hidden>
      <h1>Work</h1>
      <p>Where I've applied my skills — and what I've built.</p>
      <div id="work-timeline" class="timeline" aria-label="Work experience timeline"></div>
    </section>

    <section class="panel" id="travels" data-panel hidden>
      <h1>Travels</h1>
      <p>Places, projects, and stories (coming soon).</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; 2026 Karoline Nielsen</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
